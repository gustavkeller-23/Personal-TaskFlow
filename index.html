<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Gerenciador de Tarefas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ═══════════════ TITLE BAR CUSTOMIZADA ═══════════════ -->
  <header class="titlebar" id="titlebar">
    <div class="titlebar-drag">
      <div class="titlebar-logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <defs><linearGradient id="logo-grad" x1="5" y1="3" x2="19" y2="21"><stop stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient></defs>
        </svg>
        <span>TaskFlow</span>
      </div>
    </div>
    <div class="titlebar-controls">
      <button class="titlebar-btn" id="btn-minimize" title="Minimizar">
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <button class="titlebar-btn" id="btn-maximize" title="Maximizar">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
      </button>
      <button class="titlebar-btn titlebar-btn--close" id="btn-close" title="Fechar">
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <!-- ═══════════════ CONTEÚDO PRINCIPAL ═══════════════ -->
  <main class="app">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>Navegação</h2>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-item active" data-filter="all" id="nav-all">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Todas as Tarefas</span>
          <span class="nav-badge" id="badge-all">0</span>
        </button>
        <button class="nav-item" data-filter="pending" id="nav-pending">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/><path d="M12 7v5l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>Pendentes</span>
          <span class="nav-badge" id="badge-pending">0</span>
        </button>
        <button class="nav-item" data-filter="completed" id="nav-completed">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Concluídas</span>
          <span class="nav-badge" id="badge-completed">0</span>
        </button>

        <div class="nav-separator"></div>
        <p class="nav-section-title">Prioridade</p>

        <button class="nav-item" data-filter="high" id="nav-high">
          <span class="priority-dot priority-dot--high"></span>
          <span>Alta</span>
          <span class="nav-badge" id="badge-high">0</span>
        </button>
        <button class="nav-item" data-filter="medium" id="nav-medium">
          <span class="priority-dot priority-dot--medium"></span>
          <span>Média</span>
          <span class="nav-badge" id="badge-medium">0</span>
        </button>
        <button class="nav-item" data-filter="low" id="nav-low">
          <span class="priority-dot priority-dot--low"></span>
          <span>Baixa</span>
          <span class="nav-badge" id="badge-low">0</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="storage-info" id="storage-info">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4" stroke="currentColor" stroke-width="1.5"/></svg>
          <span>Dados salvos localmente</span>
        </div>
      </div>
    </aside>

    <!-- CONTEÚDO -->
    <section class="content">
      <!-- Header -->
      <div class="content-header">
        <div>
          <h1 id="page-title">Todas as Tarefas</h1>
          <p class="subtitle" id="page-subtitle">Gerencie todas as suas tarefas</p>
        </div>
        <button class="btn-add" id="btn-add-task">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 5v14m-7-7h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Nova Tarefa</span>
        </button>
      </div>

      <!-- Barra de busca e filtros -->
      <div class="toolbar">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <input type="text" id="search-input" placeholder="Buscar tarefas..." autocomplete="off">
        </div>
        <div class="sort-group">
          <label>Ordenar:</label>
          <select id="sort-select">
            <option value="newest">Mais recentes</option>
            <option value="oldest">Mais antigos</option>
            <option value="priority">Prioridade</option>
            <option value="dueDate">Data de vencimento</option>
            <option value="alphabetical">Alfabético</option>
          </select>
        </div>
      </div>

      <!-- Lista de tarefas -->
      <div class="task-list" id="task-list">
        <!-- Renderizado via JS -->
      </div>

      <!-- Estado vazio -->
      <div class="empty-state hidden" id="empty-state">
        <svg width="80" height="80" viewBox="0 0 24 24" fill="none">
          <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" stroke="url(#empty-grad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <defs><linearGradient id="empty-grad" x1="5" y1="3" x2="19" y2="21"><stop stop-color="#818cf8" stop-opacity="0.4"/><stop offset="1" stop-color="#c084fc" stop-opacity="0.4"/></linearGradient></defs>
        </svg>
        <h3>Nenhuma tarefa encontrada</h3>
        <p>Clique em "Nova Tarefa" para começar</p>
      </div>
    </section>
  </main>

  <!-- ═══════════════ MODAL NOVA/EDITAR TAREFA ═══════════════ -->
  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal" id="task-modal">
      <div class="modal-header">
        <h2 id="modal-title">Nova Tarefa</h2>
        <button class="modal-close" id="modal-close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <form id="task-form">
        <div class="form-group">
          <label for="task-title">Título <span class="required">*</span></label>
          <input type="text" id="task-title" placeholder="Ex: Finalizar relatório mensal" required>
        </div>

        <div class="form-group">
          <label for="task-description">Descrição</label>
          <textarea id="task-description" rows="3" placeholder="Descreva os detalhes da tarefa..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="task-category">Categoria</label>
            <div class="category-input-wrapper">
              <input type="text" id="task-category" placeholder="Ex: Trabalho" list="category-suggestions">
              <datalist id="category-suggestions"></datalist>
            </div>
          </div>

          <div class="form-group">
            <label for="task-priority">Prioridade</label>
            <select id="task-priority">
              <option value="low">🟢 Baixa</option>
              <option value="medium" selected>🟡 Média</option>
              <option value="high">🔴 Alta</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="task-due-date">Data de Vencimento</label>
          <input type="date" id="task-due-date">
        </div>

        <input type="hidden" id="task-id">

        <div class="form-actions">
          <button type="button" class="btn-cancel" id="btn-cancel">Cancelar</button>
          <button type="submit" class="btn-submit" id="btn-submit">Criar Tarefa</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ═══════════════ MODAL CONFIRMAÇÃO EXCLUSÃO ═══════════════ -->
  <div class="modal-overlay hidden" id="delete-overlay">
    <div class="modal modal--small">
      <div class="modal-header">
        <h2>Confirmar Exclusão</h2>
      </div>
      <p class="delete-message">Tem certeza que deseja excluir esta tarefa? Esta ação não pode ser desfeita.</p>
      <div class="form-actions">
        <button class="btn-cancel" id="btn-delete-cancel">Cancelar</button>
        <button class="btn-danger" id="btn-delete-confirm">Excluir</button>
      </div>
    </div>
  </div>

  <!-- ═══════════════ TOAST / NOTIFICAÇÃO ═══════════════ -->
  <div class="toast-container" id="toast-container"></div>

  <script src="renderer.js"></script>
</body>
</html>
